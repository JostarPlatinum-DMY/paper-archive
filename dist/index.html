  <template id="view-video">
    <p class="eyebrow">内容运营 / 个人课程项目 · 2026</p>
    <h3 class="project-title" tabindex="-1">AI 宣传视频工作流</h3>
    <div class="case-cover case-video-cover"></div>
    <p class="reader-intro">围绕 GDPR 科普视频，梳理观众从看到违规情境到理解正确做法的观看路径。</p>
    <dl class="evidence-metrics"><div><dt>受众画像</dt><dd>3 类</dd></div><div><dt>复盘方案</dt><dd>4 版</dd></div><div><dt>复盘镜头</dt><dd>12 组</dd></div></dl>
    <div class="case-copy">
      <section><h4>先定观看路径</h4><p>将内容拆成违规情境、风险解释和正确做法。按受众对规则的熟悉程度设定画像与信息理解指标。</p></section>
      <section><h4>搭建生产流程</h4><p>用 DeepSeek 和 ChatGPT 辅助制作脚本与分镜，独立串联 ComfyUI 节点，联动即梦、可灵和 Sora 2 制作素材。</p></section>
      <section><h4>模拟复盘与迭代</h4><p>按信息清晰度、镜头连贯性和复用成本对比四版方案，整理问题、下轮优先级及可复用的节点流程。</p></section>
    </div>
  </template>

  <template id="view-market">

    <p class="reader-intro">从大学生购买游戏的场景切入，设计连接发现、比价和社区互动的网页原型。</p>

      <section><h4>把需求放进原型</h4><p>围绕游戏发现、比价购买和社区互动搭建网页原型，通过三轮模拟迭代梳理功能优先级。</p></section>

  <template id="view-campaign">
    <p class="eyebrow">公开工具 / Campaign Lens</p>
    <h3 class="project-title" tabindex="-1">文案审阅台</h3>
    <p class="reader-intro">在内容发布前，把值得人工核查的表达标出来。</p>
    <div class="case-cover"></div>
    <div class="case-copy">
      <section><h4>问题</h4><p>审阅营销文案时，需要同时关注绝对化表述、效果承诺和促销条件。线索分散在文字中，反复查找容易打断审阅。</p></section>
      <section><h4>做法</h4><p>把常见问题写成可检查的规则。输入中文文案后，界面指出命中原文，附上提示原因、核查问题和改写方向。文案在浏览器本地处理，审阅清单可复制为 Markdown。</p></section>
      <section><h4>设计取舍</h4><p>将结果呈现为人工核查线索，保留上下文和判断空间。合规结论由审阅者结合实际情况作出。</p></section>
    </div>
    <a class="case-source" href="https://github.com/JostarPlatinum-DMY/campaign-lens" target="_blank" rel="noopener noreferrer">在 GitHub 查看项目 ↗</a>
  </template>

  <template id="view-resume">
    <p class="eyebrow">公开工具 / 浏览器扩展</p>
    <h3 class="project-title" tabindex="-1">表单预填助手</h3>
    <p class="reader-intro">在不同招聘页面复用个人资料，填入前逐项核对。</p>
    <div class="case-cover"></div>
    <div class="case-copy">
      <section><h4>问题</h4><p>多个招聘表单可能询问相同信息，字段名称和布局却各不相同。重复录入占用时间，也增加了错填的机会。</p></section>
      <section><h4>做法</h4><p>在扩展中预先保存资料。打开招聘网页后，扩展识别可见字段并展示映射预览，用户核对、勾选后再填入。</p></section>
      <section><h4>设计取舍</h4><p>把提交留给使用者。资料值保存在扩展本地，映射请求使用字段描述和已填写的资料字段名称。</p></section>
    </div>
    <a class="case-source" href="https://github.com/JostarPlatinum-DMY/resume-field-assistant" target="_blank" rel="noopener noreferrer">在 GitHub 查看项目 ↗</a>
  </template>
